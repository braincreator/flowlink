server {
    listen 80;
    server_name flowlink.flow-masters.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flowlink.flow-masters.ru;

    ssl_certificate /etc/letsencrypt/live/flow-masters.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow-masters.ru/privkey.pem;

    # Relay API proxy (bypass Next.js — direct to Rust relay)
    location /api/relay/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Relay WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Relay health endpoint
    location /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    # Relay metrics
    location /metrics {
        proxy_pass http://127.0.0.1:8080;
    }

    # MCP endpoint
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Next.js website (server mode — handles /api/* BFF routes itself)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
