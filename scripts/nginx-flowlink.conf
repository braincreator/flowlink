server {
    listen 80;
    server_name flowlink.flow-masters.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flowlink.flow-masters.ru;

    ssl_certificate /etc/letsencrypt/live/flow-masters.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow-masters.ru/privkey.pem;

    # Website (static)
    root /var/www/flowlink/website;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health endpoint proxy
    location /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files with cache
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
