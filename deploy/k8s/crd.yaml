apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flowlinkshieldpolicies.shield.flowlink.ai
  labels:
    app.kubernetes.io/name: flowlink-shield
    app.kubernetes.io/component: crd
spec:
  group: shield.flowlink.ai
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [enabled, rules, relayUrl]
          properties:
            enabled:
              type: boolean
              description: Enable Shield for this namespace
            mode:
              type: string
              enum: [Monitor, Enforce]
              default: Monitor
              description: Shield mode — monitor (observe) or enforce (block)
            rules:
              type: array
              items:
                type: object
                required: [name, action, patterns]
                properties:
                  name:
                    type: string
                  action:
                    type: string
                    enum: [allow, deny, ask]
                  patterns:
                    type: array
                    items:
                      type: string
            relayUrl:
              type: string
              description: Relay endpoint for audit events
            sidecarImage:
              type: string
              default: ghcr.io/flowlink/shield:latest
            watchNamespaces:
              type: array
              items:
                type: string
            admissionWebhook:
              type: boolean
              default: true
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: flowlinkshieldpolicies
    singular: flowlinkshieldpolicy
    kind: FlowLinkShieldPolicy
    shortNames: [flsp]
