apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowlink-operator
  namespace: flowlink-system
  labels:
    app.kubernetes.io/name: flowlink-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowlink-operator
  labels:
    app.kubernetes.io/name: flowlink-operator
rules:
  - apiGroups: [shield.flowlink.ai]
    resources: [flowlinkshieldpolicies]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [shield.flowlink.ai]
    resources: [flowlinkshieldpolicies/status]
    verbs: [update, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flowlink-operator
  labels:
    app.kubernetes.io/name: flowlink-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flowlink-operator
subjects:
  - kind: ServiceAccount
    name: flowlink-operator
    namespace: flowlink-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowlink-operator
  namespace: flowlink-system
  labels:
    app.kubernetes.io/name: flowlink-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowlink-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowlink-operator
    spec:
      serviceAccountName: flowlink-operator
      containers:
        - name: operator
          image: ghcr.io/flowlink/operator:latest
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8080
              name: health
          env:
            - name: FLOWLINK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLOWLINK_RELAY_URL
              value: "http://flowlink-relay.flowlink-system:8080"
            - name: FLOWLINK_MODE
              value: "enforce"
            - name: FLOWLINK_WEBHOOK_PORT
              value: "9443"
            - name: FLOWLINK_CERT_DIR
              value: "/etc/flowlink-certs"
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/flowlink-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: webhook-certs
          secret:
            secretName: flowlink-webhook-certs
