[package]
name = "flowlink_slack_integration"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hyper = { version = "0.14", features = ["full"] }
flowlink_core = { path = "../core" }
flowlink_relay = { path = "../relay" }

# Slack SDK dependencies
slack-morphism = { version = "1.0", features = ["hyper", "reqwest"] }
slack-morphism-models = { version = "1.0" }