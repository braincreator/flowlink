[package]
name = "flowlink_webhook_receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hyper = { version = "0.14", features = ["full"] }
flowlink_core = { path = "../core" }
flowlink_relay = { path = "../relay" }
flowlink_discord_bot = { path = "../discord_bot" }
flowlink_slack_integration = { path = "../slack_integration" }

# Webhook verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# URL parsing
url = "2.3"
percent-encoding = "2.1"

# Database integration
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Async runtime
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["cors", "trace", "full"] }

# Configuration
config = "0.13"
clap = { version = "4.0", features = ["derive"] }