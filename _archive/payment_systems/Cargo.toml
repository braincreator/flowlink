[package]
name = "flowlink_payment_systems"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
base64 = "0.21"
hex = "0.4"
url = "2.3"
once_cell = "1.19"
regex = "1.7"

# YooKassa API
yookassa = "2.5"

# Qiwi (optional - only if needed)
# qiwipay = "0.1"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"