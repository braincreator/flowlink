[package]
name = "flowlink_k8s_operator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
k8s-openapi = { version = "0.17", features = ["v1_26", "serde"] }
kube = { version = "0.78", features = ["runtime", "client", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
config = "0.13"
futures = "0.3"
tower = "0.4"

[dev-dependencies]
tokio-test = "0.4"