[package]
name = "flowlink_ci_cd_webhooks"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
url = "2.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
once_cell = "1.19"
regex = "1.7"

[dev-dependencies]
tokio-test = "0.4"