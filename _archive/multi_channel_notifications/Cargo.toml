[package]
name = "flowlink_multi_channel_notifications"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
url = "2.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
once_cell = "1.19"
regex = "1.7"
lettre = { version = "0.11", features = ["builder", "serde"] }
 lettre = "0.11"
 lettre_email = "0.9"
 base64 = "0.21"
 hmac = "0.12"
 sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"