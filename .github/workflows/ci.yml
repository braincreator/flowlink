name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev protobuf-compiler
      - run: cargo check --all-targets
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev protobuf-compiler
      - run: cargo test --workspace --lib
        env:
          SQLX_OFFLINE: true

  build-linux:
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build Linux x86_64 (musl)
        run: cross build --release --target x86_64-unknown-linux-musl -p flowlink
      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/flowlink
      - name: Compress
        run: gzip -c target/x86_64-unknown-linux-musl/release/flowlink > flowlink-linux-x86_64.gz
      - name: SHA256
        run: sha256sum flowlink-linux-x86_64.gz > flowlink-linux-x86_64.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flowlink-linux-x86_64
          path: |
            flowlink-linux-x86_64.gz
            flowlink-linux-x86_64.gz.sha256

  build-macos-arm64:
    runs-on: macos-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flowlink
      - name: Compress
        run: gzip -c target/release/flowlink > flowlink-macos-arm64.gz
      - name: SHA256
        run: shasum -a 256 flowlink-macos-arm64.gz > flowlink-macos-arm64.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flowlink-macos-arm64
          path: |
            flowlink-macos-arm64.gz
            flowlink-macos-arm64.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos-arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/flowlink-linux-x86_64/*
            artifacts/flowlink-macos-arm64/*
          generate_release_notes: true
