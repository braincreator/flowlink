# Deploy FlowLink backend to VPS
#
# Required secrets (add in GitHub → Settings → Secrets and variables → Actions):
#   HOST      - VPS IP address (e.g. 93.93.207.44)
#   SSH_KEY   - Private SSH key with access to the VPS
#   SSH_PORT  - SSH port (default: 22)
#   USERNAME  - SSH username on the VPS

name: Deploy Backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: |
          curl -L https://github.com/rust-cross/cargo-zigbuild/releases/latest/download/cargo-zigbuild-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin

      - name: Build
        run: cargo zigbuild --release --bin flowlink --target x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --lib

      - name: Copy binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "target/x86_64-unknown-linux-gnu/release/flowlink"
          target: "/opt/flowlink/bin/flowlink"
          strip_components: 3

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            chmod +x /opt/flowlink/bin/flowlink
            sudo systemctl restart flowlink
            sleep 2
            sudo systemctl is-active flowlink
