name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libssl-dev pkg-config libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Update lockfile for stable toolchain
        run: cargo update

      - name: Build release binary
        run: cargo build --release --bin flowlink

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: flowlink-binary
          path: target/release/flowlink
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: flowlink-binary
          path: ./flowlink

      - name: Make binary executable
        run: chmod +x ./flowlink

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "flowlink"
          target: "/usr/local/bin/flowlink"
          strip_components: 0

      - name: Restart service & health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          script: |
            set -euo pipefail

            # Backup
            if [ -f /usr/local/bin/flowlink ]; then
              cp /usr/local/bin/flowlink /usr/local/bin/flowlink.bak
            fi

            # Stop
            systemctl stop flowlink || true
            sleep 1

            # Start
            systemctl start flowlink
            sleep 3

            # Health check
            curl -sf http://localhost:8080/healthz || {
              echo "Health check failed! Rolling back..."
              systemctl stop flowlink || true
              if [ -f /usr/local/bin/flowlink.bak ]; then
                mv /usr/local/bin/flowlink.bak /usr/local/bin/flowlink
                systemctl start flowlink
              fi
              exit 1
            }

            echo "Deploy successful!"
