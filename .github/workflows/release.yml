name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build agent (linux amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-linux-amd64 ./cmd/agent

      - name: Build agent (linux arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/flowlink-linux-arm64 ./cmd/agent

      - name: Build agent (darwin amd64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-darwin-amd64 ./cmd/agent

      - name: Build agent (darwin arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/flowlink-darwin-arm64 ./cmd/agent

      - name: Build agent (windows amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-windows-amd64.exe ./cmd/agent

      - name: Build relay (linux amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-relay-linux-amd64 ./cmd/relay

      - name: Build relay (linux arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/flowlink-relay-linux-arm64 ./cmd/relay

      - name: Build relay (darwin arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/flowlink-relay-darwin-arm64 ./cmd/relay

      - name: Build relay (windows amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-relay-windows-amd64.exe ./cmd/relay

      - name: Build bot (linux amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/flowlink-bot-linux-amd64 ./cmd/bot

      - name: Build bot (darwin arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/flowlink-bot-darwin-arm64 ./cmd/bot

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlowLink ${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
