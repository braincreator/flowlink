[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/crypto",
    "crates/shield",
    "crates/agent",
    "crates/relay",
    "crates/cli",
    "crates/k8s",
    "crates/gitops",
    "crates/billing",
    "crates/db",
    "crates/mcp",
    "crates/sentinel",
    "crates/api",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
