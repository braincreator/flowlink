<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="arc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Central dot -->
  <circle cx="50" cy="50" r="6" fill="#3b82f6"/>
  <!-- Inner arc - lighter blue, ~220 degrees -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="70 113" transform="rotate(-110 50 50)"/>
  <!-- Outer arc - gradient, ~200 degrees -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#arc-grad)" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="110 201" transform="rotate(-100 50 50)"/>
</svg>
