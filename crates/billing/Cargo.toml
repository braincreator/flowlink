[package]
name = "flowlink-billing"
version = "0.2.0"
edition = "2021"
description = "Billing engine for FlowLink: plans, usage tracking, invoices, payments"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-db = { path = "../db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
sha2 = "0.10"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }

[features]
default = ["tochka-live"]
tochka-live = ["reqwest/rustls-tls"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
