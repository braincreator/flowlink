[package]
name = "flowlink-billing"
version = "0.3.4"
edition = "2021"
description = "Billing engine for FlowLink: plans, usage tracking, invoices, payments"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-db = { path = "../db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
sha2 = "0.10"
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
axum = { version = "0.8", features = ["macros"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"], optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.13", optional = true }
log = { version = "0.4", optional = true }

[features]
default = ["tochka-live"]
tochka-live = ["reqwest/rustls-tls"]
server = ["dep:axum", "dep:sqlx", "dep:base64", "dep:hmac", "dep:log"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
