[package]
name = "flowlink-auth"
version = "0.3.4"
edition = "2021"
description = "Authentication for FlowLink: JWT, OAuth, SAML, 2FA, email auth"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-db = { path = "../db" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
async-trait = "0.1"
log = "0.4"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
rand = "0.8"

[features]
default = []
