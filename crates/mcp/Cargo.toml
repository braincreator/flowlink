[package]
name = "flowlink-mcp"
version = "0.3.4"
edition = "2021"

[dependencies]
flowlink-shield = { path = "../shield" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
