[package]
name = "flowlink-sentinel"
version = "0.3.4"
edition = "2021"
description = "FlowLink L0 kernel-level syscall monitoring (eBPF on Linux, ESF on macOS)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"
libc = "0.2"

# Linux only — enable with: --features linux-ebpf
[target.'cfg(target_os = "linux")'.dependencies]
libbpf-sys = { version = "1.5", optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
endpointsecurity = { version = "0.3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[build-dependencies]

[features]
default = []
linux-ebpf = ["libbpf-sys", "bytes"]
esf = ["endpointsecurity", "crossbeam-channel"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
