[package]
name = "flowlink-core"
version = "0.3.4"
edition = "2021"
description = "FlowLink core protocol types, config, and shared definitions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
vault = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
serde_yaml = "0.9"

[[bench]]
name = "bench_core"
harness = false
