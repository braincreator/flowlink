[package]
name = "flowlink-crypto"
version = "0.3.4"
edition = "2021"
description = "FlowLink E2EE — X25519 key exchange + AES-256-GCM encryption"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.13"
hkdf = "0.12"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "bench_crypto"
harness = false
