[package]
name = "flowlink-integrations-telegram"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
flowlink-integrations-core = { path = "../integrations-core" }
flowlink-db = { path = "../db" }
flowlink-bot-client = { path = "../bot-client" }

[features]
default = []
