[package]
name = "flowlink-bot-client"
version = "0.1.0"
edition = "2021"
description = "FlowLink API client for bots, integrations, and CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
log = "0.4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
