[package]
name = "flowlink-service-traits"
version = "0.1.0"
edition = "2021"
description = "Service provider traits for cloud/standalone mode abstraction"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
