[package]
name = "flowlink"
version = "0.1.0"
edition = "2021"
description = "FlowLink CLI — agent and relay management"

[[bin]]
name = "flowlink"
path = "src/main.rs"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-agent = { path = "../agent" }
flowlink-relay = { path = "../relay" }
flowlink-crypto = { path = "../crypto" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
rand = "0.8"
