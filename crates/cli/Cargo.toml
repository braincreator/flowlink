[package]
name = "flowlink"
version = "0.1.0"
edition = "2021"
description = "FlowLink CLI — agent and relay management"

[[bin]]
name = "flowlink"
path = "src/main.rs"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-agent = { path = "../agent" }
flowlink-relay = { path = "../relay" }
flowlink-crypto = { path = "../crypto" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
env_logger = "0.11"
hostname = "0.4"
rand = "0.8"
flowlink-mcp = { path = "../mcp" }
flowlink-api = { path = "../api" }
flowlink-shield = { path = "../shield" }
flowlink-sentinel = { path = "../sentinel" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
default = []
linux-ebpf = ["flowlink-api/linux-ebpf"]
