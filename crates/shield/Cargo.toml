[package]
name = "flowlink-shield"
version = "0.1.0"
edition = "2021"
description = "FlowLink Shield — eBPF-powered 3-level command guardian"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
