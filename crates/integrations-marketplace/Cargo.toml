[package]
name = "flowlink-integrations-marketplace"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1"
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }
flowlink-integrations-core = { path = "../integrations-core" }
flowlink-auth = { path = "../auth" }
flowlink-db = { path = "../db" }

[features]
default = []
