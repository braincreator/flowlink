[package]
name = "flowlink-agent"
version = "0.1.0"
edition = "2021"
description = "FlowLink agent — connects to relay, executes commands, manages backups"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "agent_bench"
harness = false

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }
flowlink-shield = { path = "../shield" }
flowlink-gitops = { path = "../gitops", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
rand = "0.8"
native-tls = "0.2"
libc = "0.2"
hostname = "0.4"
regex = "1"

[features]
default = []
gitops = ["flowlink-gitops", "flowlink-shield/gitops"]
