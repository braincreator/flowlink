[package]
name = "flowlink-agent"
version = "0.1.0"
edition = "2021"
description = "FlowLink agent — connects to relay, executes commands, manages backups"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }
flowlink-shield = { path = "../shield" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
base64 = "0.22"
