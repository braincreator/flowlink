[package]
name = "flowlink-bot"
version = "0.3.4"
edition = "2021"
description = "Telegram bot for FlowLink: commands, notifications, approvals"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-db = { path = "../db" }
flowlink-billing = { path = "../billing" }
flowlink-notifications = { path = "../notifications" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
rand = "0.8"
teloxide = { version = "0.14", features = ["macros"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = ["tgbot"]
tgbot = ["dep:teloxide", "dep:reqwest"]
