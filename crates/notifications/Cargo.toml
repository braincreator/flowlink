[package]
name = "flowlink-notifications"
version = "0.3.4"
edition = "2021"
description = "Notification system for FlowLink: email, telegram, preferences"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-db = { path = "../db" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
log = "0.4"
dashmap = "6"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "pool", "hostname"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
teloxide = { version = "0.14", features = ["macros"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.8"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
