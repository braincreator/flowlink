[package]
name = "flowlink-gitops"
version = "0.3.4"
edition = "2021"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }

tokio = { version = "1", features = ["full", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Git operations
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl", "vendored-libgit2"] }

# File watching (inotify/FSEvents)
notify = { version = "8", features = ["macos_kqueue"] }

# Docker API
bollard = "0.18"

# Backup archives
tar = "0.4"
flate2 = "1"

# Crypto (integrity chain, vault encryption)
aes-gcm = "0.10"
hex = "0.4"

# HTTP client (S3 upload, relay API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Async traits
async-trait = "0.1"
futures-util = "0.3"

# Utilities
thiserror = "2"
anyhow = "1"
glob-match = "0.2"
shellexpand = "3"
regex = "1"
hostname = "0.4"
libc = "0.2"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util", "macros"] }