[package]
metadata.cargo-bin-jobs = false
name = "flowlink-relay"
version = "0.1.0"
edition = "2021"
description = "FlowLink relay server — WebSocket hub for agents, HTTP API for clients"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }
flowlink-billing = { path = "../billing" }
flowlink-db = { path = "../db" }
flowlink-shield = { path = "../shield" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1"
futures-util = "0.3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
tempfile = "3"
shellexpand = "3"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
prometheus = "0.13"
regex = "1"
notify = "7"
teloxide = { version = "0.14", features = ["macros"], optional = true }
jsonwebtoken = "9"
url = "2"
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
base64 = "0.22"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
flate2 = "1"
urlencoding = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
http-body-util = "0.1"
rcgen = "0.13"
tempfile = "3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["tgbot"]
tgbot = ["dep:teloxide"]

[[bench]]
name = "bench_relay"
harness = false

