[package]
name = "flowlink-relay"
version = "0.1.0"
edition = "2021"
description = "FlowLink relay server — WebSocket hub for agents, HTTP API for clients"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
dashmap = "6"
