[package]
name = "flowlink-relay"
version = "0.1.0"
edition = "2021"
description = "FlowLink relay server — WebSocket hub for agents, HTTP API for clients"

[dependencies]
flowlink-core = { path = "../core" }
flowlink-crypto = { path = "../crypto" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1"
futures-util = "0.3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = "0.1"
rand = "0.8"
hex = "0.4"
tempfile = "3"
